---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="cv-viewer-body">
    {% include browser-upgrade.html %}

    <main class="cv-viewer-main" aria-label="{{ page.title | default: 'PDF' | escape }}">
      <iframe
        class="cv-viewer-frame"
        title="{{ page.title | default: 'PDF' | escape }}"
        src="{{ page.pdf_url }}">
      </iframe>

      <div class="cv-viewer-darken" aria-hidden="true"></div>

      <div class="cv-viewer-actions" aria-label="{{ page.title | default: 'PDF' | escape }} actions">
        <a href="/" target="_self">Home</a>
        <a href="{{ page.download_url }}"{% if page.download_filename %} download="{{ page.download_filename }}"{% endif %}>Download</a>
      </div>
    </main>
  </body>
</html>
