name: Get Citation Data

# Not on page_build: every push to main would query Scholar again, and the
# extra requests are what get the runner rate-limited (HTTP 429).
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Worst case (3 slow attempts + fallback read) is ~3 minutes plus setup;
    # leave room so the job falls back to old data instead of being cancelled.
    timeout-minutes: 6

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: sudo apt-get install python3-setuptools

    - name: Install Python Requirements
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt

    - name: Run main.py
      run: |
        cd ./google_scholar_crawler
        python3 main.py
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

    - name: Commit and Push JSON Results
      run: |
        cd ./google_scholar_crawler/results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
