<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小六壬起卦</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换黑白背景" title="切换黑白背景">
        <span id="theme-toggle-icon" aria-hidden="true">黑</span>
    </button>

    <h1>小六壬起卦</h1>

    <div class="tabs" role="tablist" aria-label="起卦方式">
        <button type="button" id="time-tab" class="tab-link active" data-tab-target="TimeMode" role="tab" aria-controls="TimeMode" aria-selected="true">按当前时间</button>
        <button type="button" id="number-tab" class="tab-link" data-tab-target="NumberMode" role="tab" aria-controls="NumberMode" aria-selected="false">按随机数字</button>
    </div>

    <section id="TimeMode" class="tab-content active" role="tabpanel" aria-labelledby="time-tab">
        <div class="info-panel">
            <p><strong>公历时间:</strong> <span id="solar-time"></span></p>
            <p><strong>农历时间:</strong> <span id="lunar-time"></span></p>
            <p><strong>当前时辰:</strong> <span id="hour-branch"></span></p>
        </div>
        <div class="output-wrapper">
            <div class="process">
                <h2>推算过程</h2>
                <div id="time-calculation-process"></div>
            </div>
            <div id="time-result-container" class="result"></div>
        </div>
        <button type="button" id="time-recalculate">重新推算</button>
    </section>

    <section id="NumberMode" class="tab-content" role="tabpanel" aria-labelledby="number-tab">
        <div class="info-panel">
            <p>系统将随机生成三个1-1000内的数字，模拟天、地、人三才起卦。</p>
            <div class="number-inputs">
                <input type="number" id="num1" placeholder="数字一" aria-label="随机数字一" readonly>
                <input type="number" id="num2" placeholder="数字二" aria-label="随机数字二" readonly>
                <input type="number" id="num3" placeholder="数字三" aria-label="随机数字三" readonly>
            </div>
        </div>
        <div class="output-wrapper">
             <div class="process">
                <h2>推算过程</h2>
                <div id="number-calculation-process"></div>
            </div>
            <div id="number-result-container" class="result"></div>
        </div>
        <button type="button" id="number-recalculate">随机推算</button>
    </section>

    <section class="acknowledgements" aria-labelledby="acknowledgements-title">
        <h2 id="acknowledgements-title">Acknowledgements / 致谢</h2>
        <p>
            本页面基于 <a href="https://github.com/fyapeng/liuren/" target="_blank" rel="noopener noreferrer">fyapeng/liuren</a>
        的开源代码构建，原项目作者为 fyapeng，遵循 MIT License。
        </p>
        <p>
            公农历转换与小六壬推算逻辑沿用原项目实现，算法可能存在偏差；相关内容仅供娱乐和学习参考。
        </p>
    </section>
    
    <div class="footer">
        <p class="disclaimer">科学生活，理性看待，玄学仅供娱乐参考。</p>
    </div>
</main>

<template id="result-template">
    <div class="result-content">
        <div class="result-header">
            <span class="result-name"></span>
            <span class="result-fortune"></span>
        </div>
        <div class="result-body">
            <p><strong>核心涵义：</strong><span class="result-meaning"></span></p>
            <p><strong>事态分析：</strong><span class="result-analysis"></span></p>
        </div>
    </div>
</template>

<script src="scripts.js"></script>
</body>
</html>
